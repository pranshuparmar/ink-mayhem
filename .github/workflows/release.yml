name: Release

# Manual only: Actions → Release → Run workflow (on main). It picks the next version, runs lint
# and the tests, builds and signs the release APK, verifies the signature, then creates the
# vX.Y.Z tag and a GitHub Release with the APK. Nothing triggers it automatically.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the last release's version to bump (the first release is 1.0.0)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Or an exact version instead, e.g. 1.2.0 or 1.3.0-beta.1 (leave empty to bump)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error title=Wrong branch::Releases are made from main: pick main under \"Use workflow from\"."
          exit 1

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing signing secrets::Add these repository secrets before releasing:$missing (docs/TECH.md > Release signing)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags, to find the last release

      - name: Pick the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          version="${VERSION#v}"
          if [ -z "$version" ]; then
            # the last stable release (vX.Y.Z), bumped; prereleases and latest-debug don't count
            last=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            if [ -z "$last" ]; then
              version=1.0.0
            else
              IFS=. read -r major minor patch <<< "${last#v}"
              case "$BUMP" in
                major) version="$((major + 1)).0.0" ;;
                minor) version="$major.$((minor + 1)).0" ;;
                *) version="$major.$minor.$((patch + 1))" ;;
              esac
            fi
          fi
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Bad version::Versions look like 1.2.3 or 1.2.3-beta.1 (got $version)."
            exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          if [ "$minor" -ge 1000 ] || [ "$patch" -ge 1000 ]; then
            echo "::error title=Bad version::Minor and patch must be below 1000 for the versionCode scheme."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error title=Already released::v$version already exists. Bump again or give a new version."
            exit 1
          fi
          # versionCode = major * 1,000,000 + minor * 1,000 + patch (prereleases share their base code).
          code=$(( major * 1000000 + minor * 1000 + patch ))
          echo "Releasing v$version (versionCode $code) from $GITHUB_SHA"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ -n "${BASH_REMATCH[4]}" ]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode the keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Lint, test and build the signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew lint test assembleRelease --stacktrace
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Verify the signature
        id: apk
        run: |
          apk=android/build/outputs/apk/release/android-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error title=Unsigned build::No signed APK at $apk."; ls -R android/build/outputs/apk || true; exit 1
          fi
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          name="ink-mayhem-${{ steps.version.outputs.name }}.apk"
          cp "$apk" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Tag and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          extra=()
          if [ "$PRERELEASE" = "true" ]; then extra+=(--prerelease); fi
          # creates the tag on the commit that was built
          gh release create "$TAG" "${{ steps.apk.outputs.name }}" \
            --target "$GITHUB_SHA" --generate-notes \
            --title "Ink Mayhem ${{ steps.version.outputs.name }}" "${extra[@]}"
