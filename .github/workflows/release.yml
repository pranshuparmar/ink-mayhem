name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing signing secrets::Add these repository secrets before tagging a release:$missing (docs/TECH.md > Release signing)."
            exit 1
          fi

      - name: Version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Bad tag::Tags must look like v1.2.3 or v1.2.3-beta.1 (got $GITHUB_REF_NAME)."
            exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          if [ "$minor" -ge 1000 ] || [ "$patch" -ge 1000 ]; then
            echo "::error title=Bad tag::Minor and patch must be below 1000 for the versionCode scheme."
            exit 1
          fi
          # versionCode = major * 1,000,000 + minor * 1,000 + patch (prereleases share their base code).
          code=$(( major * 1000000 + minor * 1000 + patch ))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ -n "${BASH_REMATCH[4]}" ]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode the keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Lint, test and build the signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew lint test assembleRelease --stacktrace
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Verify the signature
        id: apk
        run: |
          apk=android/build/outputs/apk/release/android-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error title=Unsigned build::No signed APK at $apk."; ls -R android/build/outputs/apk || true; exit 1
          fi
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          name="ink-mayhem-${{ steps.version.outputs.name }}.apk"
          cp "$apk" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          extra=()
          if [ "$PRERELEASE" = "true" ]; then extra+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.name }}" \
            --generate-notes --verify-tag \
            --title "Ink Mayhem ${{ steps.version.outputs.name }}" "${extra[@]}"
