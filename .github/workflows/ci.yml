name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # "Run workflow" on the Actions tab (also in the GitHub app): rebuild any branch on demand
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used on main, to update the latest-debug prerelease
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # Every debug APK must carry the same key, or Android refuses to install it over the last
      # one and the player has to uninstall, losing calibration, tutorial progress and best score.
      # A key from the ANDROID_DEBUG_KEYSTORE_BASE64 secret is permanent; without it CI makes one
      # and keeps it in the Actions cache (evicted after 7 days without a build).
      - name: Restore the CI debug key
        uses: actions/cache/restore@v6
        with:
          path: ~/.ink-mayhem/debug.keystore
          key: ink-mayhem-debug-keystore-v1

      - name: Pick the debug key
        id: debugkey
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          ks="$HOME/.ink-mayhem/debug.keystore"
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
            echo "ANDROID_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ ! -f "$ks" ]; then
            mkdir -p "$(dirname "$ks")"
            keytool -genkeypair -keystore "$ks" -storetype PKCS12 -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" -noprompt
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Debug signing::Made a new CI debug key; this APK won't install over earlier ones. Set ANDROID_DEBUG_KEYSTORE_BASE64 for a key that never changes (see README)."
          fi
          echo "ANDROID_DEBUG_KEYSTORE_PATH=$ks" >> "$GITHUB_ENV"

      - name: Save the CI debug key
        if: steps.debugkey.outputs.created == 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.ink-mayhem/debug.keystore
          key: ink-mayhem-debug-keystore-v1

      - name: Lint, test and build the debug APK
        run: ./gradlew lint test assembleDebug -PappVersionCode=${{ github.run_number }} --stacktrace

      - name: Check that a release build signs (throwaway key)
        run: |
          ks="$RUNNER_TEMP/throwaway.jks"
          keytool -genkeypair -keystore "$ks" -storetype PKCS12 -alias throwaway \
            -storepass throwaway -keypass throwaway -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI" -noprompt
          ANDROID_KEYSTORE_PATH="$ks" ANDROID_KEYSTORE_PASSWORD=throwaway ANDROID_KEY_ALIAS=throwaway \
            ANDROID_KEY_PASSWORD=throwaway ./gradlew assembleRelease --stacktrace
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify android/build/outputs/apk/release/android-release.apk
          rm -f "$ks"

      - name: Name the APK
        id: apk
        run: |
          short_sha="${GITHUB_SHA::7}"
          name="ink-mayhem-debug-${short_sha}.apk"
          cp android/build/outputs/apk/debug/android-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.run_number }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

      - name: Publish to the latest-debug prerelease
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          set -euo pipefail
          tag=latest-debug
          # Move (or create) the tag to this commit.
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi
          notes="Debug build of ${GITHUB_SHA::7} from main (run #${GITHUB_RUN_NUMBER}). Sideload the APK; see README."
          if gh release view "$tag" >/dev/null 2>&1; then
            # Replace the previous APK(s) with this one.
            for asset in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$tag" "$asset" --yes
            done
            gh release edit "$tag" --prerelease --title "Latest debug build" --notes "$notes"
          else
            gh release create "$tag" --prerelease --title "Latest debug build" --notes "$notes" --verify-tag
          fi
          gh release upload "$tag" "$APK" --clobber
